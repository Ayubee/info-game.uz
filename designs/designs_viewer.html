<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFO-GAME.UZ — Dizaynlar & Texnik Topshiriq (TZ)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #070e18; color: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh; }
  
  /* Top Bar */
  .top-banner { background: #0b1424; border-bottom: 2px solid #00e5ff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
  .logo { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
  .logo span { color: #00e5ff; }

  /* Nav Tabs */
  .design-tabs { display: flex; gap: 6px; background: rgba(7, 14, 24, 0.8); padding: 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); }
  .tab-btn { background: transparent; border: none; color: #94a3b8; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .tab-btn.active { background: #00e5ff; color: #070e18; font-weight: 800; }
  .tab-btn.hybrid { background: rgba(0, 229, 255, 0.2); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.4); }
  .tab-btn.hybrid.active { background: #00e5ff; color: #070e18; }

  .pdf-downloads { display: flex; gap: 8px; }
  .btn-pdf { background: rgba(0, 229, 255, 0.12); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.3); padding: 7px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .btn-pdf:hover { background: #00e5ff; color: #070e18; }
  .btn-pdf.tz { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.4); }

  /* Viewer Frame */
  .viewer-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  .preview-wrapper { width: 1440px; height: 980px; max-width: 98vw; max-height: calc(100vh - 100px); border-radius: 12px; overflow: hidden; border: 1px solid rgba(0, 229, 255, 0.25); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
  <div class="top-banner">
    <div class="logo">
      INFO-GAME<span>.UZ</span>
      <span style="font-size: 11px; color: #38bdf8; font-weight: 600; margin-left: 8px; background: rgba(0,229,255,0.1); padding: 2px 6px; border-radius: 4px;">v2.0 Gibrid + TZ</span>
    </div>

    <div class="design-tabs">
      <button class="tab-btn hybrid active" onclick="loadDesign('dizayn-gibrid-1-3.html', this)">⭐ Gibrid (1 + 3) Yangi</button>
      <button class="tab-btn" onclick="loadDesign('tz_texnik_topshiriq.html', this)">📋 Rasmiy TZ (Texnik Topshiriq)</button>
      <button class="tab-btn" onclick="loadDesign('dizayn-1-ocean-dark.html', this)">1. Ocean Dark</button>
      <button class="tab-btn" onclick="loadDesign('dizayn-3-notion-clean.html', this)">3. Notion Clean</button>
      <button class="tab-btn" onclick="loadDesign('dizayn-2-cyber-hud.html', this)">2. Cyber HUD</button>
      <button class="tab-btn" onclick="loadDesign('dizayn-4-rpg-bento.html', this)">4. Bento</button>
      <button class="tab-btn" onclick="loadDesign('dizayn-5-gaming-portal.html', this)">5. Media</button>
    </div>

    <div class="pdf-downloads">
      <a href="./DIZAYN_GIBRID_1_3.pdf" target="_blank" class="btn-pdf">
        📄 Gibrid PDF
      </a>
      <a href="./TZ_TEXNIK_TOPSHIRIQ.pdf" target="_blank" class="btn-pdf tz">
        📋 TZ PDF
      </a>
      <a href="./INFO-GAME_TZ_VA_GIBRID_DIZAYN.pdf" target="_blank" class="btn-pdf" style="background: #00e5ff; color: #070e18;">
        ⭐ Birlashgan PDF
      </a>
    </div>
  </div>

  <div class="viewer-container">
    <div class="preview-wrapper">
      <iframe id="designFrame" src="designs/dizayn-gibrid-1-3.html"></iframe>
    </div>
  </div>

  <script>
    function loadDesign(file, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('designFrame').src = 'designs/' + file;
    }
  </script>
</body>
</html>
